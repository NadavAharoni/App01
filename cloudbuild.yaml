# Build and deploy App01 to Cloud Run.
#
# THIS FILE IS LIVE. The Cloud Build trigger runs it on every push to main (verified 2026-08-20).
# Editing it changes how the app deploys, so treat it as production code.
#
# The trigger used to carry these steps inline, which meant nothing in the repo recorded how the
# app shipped and a fresh clone could not reproduce it. It now holds only
# `filename: cloudbuild.yaml` and points here.
#
# Deploy target: service `app01`, region us-east1, project project-159346f9-b041-4382-b4f.
# The TRIGGER itself lives in region `global` — us-east1 returns NOT_FOUND even with full access,
# which reads exactly like a permissions error and is not one. Same for `gcloud builds list`.
#
# Two things live on the trigger and CANNOT be expressed here:
#   * the branch filter (`^main$`), so feature branches never deploy;
#   * `ignoredFiles` (**/*.md, tests/**, package*.json, .gitignore, .env.example), so docs- and
#     test-only commits do not rebuild and redeploy a byte-identical revision.
# To change either, round-trip the whole resource — `gcloud builds triggers update github` cannot
# express a Cloud Run-console-created trigger and rejects it with INVALID_ARGUMENT:
#
#     gcloud beta builds triggers export 68da5a2f-0efc-48f1-8214-c3dbd54b039f #       --project project-159346f9-b041-4382-b4f --region global --destination trigger.yaml
#     # edit trigger.yaml
#     gcloud beta builds triggers import --source trigger.yaml #       --project project-159346f9-b041-4382-b4f --region global
#
# Substitutions are declared here and NOT on the trigger, deliberately: if the trigger also set
# them it would shadow these defaults and editing this file would change nothing.
#
# NOTES ON THE STEPS:
#   * `$PROJECT_ID` is a Cloud Build built-in, replacing a hardcoded project id the inline config
#     used, so this file is portable — the repo is intended to become a reusable template.
#   * `--max-instances` / `--min-instances` are explicit. They match the running service, so this
#     is not a behaviour change; the point is that the cost controls are reviewable in the repo
#     rather than being console state nobody can see.
#   * `_REPO_NAME` is a substitution rather than the `$REPO_NAME` built-in, which is empty outside
#     a repo-triggered build and would silently produce a broken image path.

substitutions:
  _SERVICE_NAME: app01
  # Artifact Registry path is <repo>/<service>; both are 'app01' here. Kept as a
  # substitution rather than the $REPO_NAME built-in, which is empty outside a
  # repo-triggered build and would silently produce a broken image path.
  _REPO_NAME: app01
  _DEPLOY_REGION: us-east1
  _AR_HOSTNAME: us-east1-docker.pkg.dev
  _AR_REPOSITORY: cloud-run-source-deploy
  # How many images to keep. 3 is enough because git is the source of truth and every
  # dependency in requirements.txt is pinned exactly, so `git revert` + push reproduces
  # any old commit. A retained image only buys speed: an instant
  # `update-traffic --to-revisions` instead of a ~90s rebuild.
  _KEEP_IMAGES: '3'

steps:
  # `--no-cache` is inherited from the original config. Each Cloud Build run starts on a clean
  # worker with no layer cache to reuse, so it costs nothing here and keeps builds reproducible.
  - id: Build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --no-cache
      - -t
      - $_AR_HOSTNAME/$PROJECT_ID/$_AR_REPOSITORY/$_REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA
      - .
      - -f
      - Dockerfile

  - id: Push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - $_AR_HOSTNAME/$PROJECT_ID/$_AR_REPOSITORY/$_REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA

  # `services update` rather than `deploy`: the service already exists, and update leaves
  # env vars and secrets set elsewhere untouched instead of resetting them.
  - id: Deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - services
      - update
      - $_SERVICE_NAME
      - --platform=managed
      - --image=$_AR_HOSTNAME/$PROJECT_ID/$_AR_REPOSITORY/$_REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA
      - --region=$_DEPLOY_REGION
      - --max-instances=1
      - --min-instances=0
      - --labels=managed-by=gcp-cloud-build-deploy-cloud-run,commit-sha=$COMMIT_SHA,gcb-build-id=$BUILD_ID
      - --quiet

  # Reap old images. Artifact Registry bills above 0.5 GB and each deploy adds ~70 MB of layers,
  # so without this the repository grows forever -- App01 reached 424 MB across 42 images before
  # this step existed. Runs last, so the image just deployed is never a candidate.
  #
  # ONLY TAGGED IMAGES ARE COUNTED OR DELETED. This is the correction to the first version of this
  # step, which kept "the newest 3 entries" and destroyed 18 revisions' images in one run. The
  # repository namespace also holds untagged OCI manifests -- attestation and metadata artifacts a
  # few KB in size -- and counting those as images meant the three keep-slots were spent on junk
  # while real images were deleted. Every genuine deploy carries its commit sha as a tag, so tags
  # are the reliable discriminator. Untagged manifests are never deleted: they are kilobytes, and
  # some are referrers attached to an image that is being kept.
  #
  # allowFailure: cleanup must never fail an otherwise good deploy.
  # $$ escapes a literal $ so Cloud Build does not read it as a substitution.
  #
  # roles/artifactregistry.writer can push but NOT delete, so without repoAdmin this step reaps
  # nothing. Under allowFailure that would be silent, which is how it went unnoticed in RiddleSite,
  # so a wholesale denial is reported loudly below.
  - id: Prune
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    allowFailure: true
    args:
      - -c
      - |
        set -u
        IMAGE=$_AR_HOSTNAME/$PROJECT_ID/$_AR_REPOSITORY/$_REPO_NAME/$_SERVICE_NAME
        KEEP=$_KEEP_IMAGES
        echo "pruning $$IMAGE -- keeping the newest $$KEEP TAGGED images"

        # createTime first so a plain reverse sort orders newest-first: ISO-8601 sorts
        # lexicographically. This deliberately does not rely on --sort-by.
        gcloud artifacts docker images list "$$IMAGE" --include-tags           --format='value(createTime,version,tags)' --quiet           | awk -F'	' 'NF>=3 && $$3 != ""' | sort -r > /tmp/tagged

        kept=$$(head -n $$KEEP /tmp/tagged | wc -l | tr -d ' ')
        tail -n +$$((KEEP + 1)) /tmp/tagged > /tmp/stale
        total=$$(wc -l < /tmp/stale | tr -d ' ')
        echo "tagged images: $$(wc -l < /tmp/tagged | tr -d ' ') | keeping: $$kept | candidates: $$total"
        if [ "$$total" -eq 0 ]; then echo "nothing to prune"; exit 0; fi

        deleted=0
        failed=0
        skipped=0
        while IFS=$$'	' read -r created digest tags; do
          [ -n "$$digest" ] || continue
          # Belt and braces: never delete what this build just shipped, whatever the ordering said.
          case " $$tags " in
            *" $COMMIT_SHA "*|*"$COMMIT_SHA"*)
              echo "skipping $$digest -- carries the tag just deployed"
              skipped=$$((skipped + 1)); continue ;;
          esac
          if gcloud artifacts docker images delete "$$IMAGE@$$digest" --quiet --delete-tags; then
            deleted=$$((deleted + 1))
          else
            failed=$$((failed + 1))
          fi
        done < /tmp/stale

        echo "deleted=$$deleted failed=$$failed skipped=$$skipped"
        if [ "$$failed" -gt 0 ] && [ "$$deleted" -eq 0 ]; then
          echo "PRUNE FAILED: every delete was rejected. The Cloud Build service account most"
          echo "likely has roles/artifactregistry.writer but not repoAdmin -- writer can push but"
          echo "cannot delete. Storage will keep growing until that is granted."
          exit 1
        fi
        echo "prune complete"

images:
  - $_AR_HOSTNAME/$PROJECT_ID/$_AR_REPOSITORY/$_REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA

options:
  logging: CLOUD_LOGGING_ONLY
  substitution_option: ALLOW_LOOSE
